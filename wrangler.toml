name = "h2o-studio-mcn"
type = "javascript"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Assets binding for serving static files
[[env.production.services]]
binding = "ASSETS"
service = "h2o-studio-pages"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "h2o-studio-db"
database_id = ""

# Environment variables
[env.production]
vars = { ADMIN_EMAIL = "admin@h2ostudio.com" }

[env.development]
vars = { ADMIN_EMAIL = "admin@h2ostudio.com" }

# Build configuration
[build]
command = "pnpm build"
cwd = "./"
watch_paths = ["client/src/**/*.{ts,tsx,css}", "src/**/*.ts"]

[build.upload]
format = "modules"
main = "src/worker.ts"

# Triggers for scheduled tasks (optional)
# [[triggers.crons]]
# cron = "0 0 * * *"
